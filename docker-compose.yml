version: '3.8'

services:
  db:
    image: postgres:15
    container_name: securite_sociale_db
    environment:
      POSTGRES_DB: ${DB_NAME:-securite_sociale_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # Si on veut accéder à la base de données depuis la machine hôte
      - "${DB_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-securite_sociale_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKER_IMAGE:-securite_sociale_backend:latest}
    container_name: securite_sociale_backend
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      # Connexion à la base de données via le nom du service docker (db)
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-securite_sociale_db}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - SERVER_FORWARD_HEADERS_STRATEGY=native
      # Dossier (dans le conteneur) où sont stockées les photos
      - UPLOAD_DIR=/app/uploads
      - UPLOAD_BASE_URL=${UPLOAD_BASE_URL:-/uploads}
    volumes:
      # Connecte le dossier des images du conteneur à un dossier persistant de l'hôte (VPS).
      # Docker crée automatiquement le dossier hôte s'il n'existe pas.
      - ${UPLOAD_HOST_DIR:-./uploads}:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
